name: CI/CD Pipeline

"on":
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: devops_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres_ci_password@localhost:5432/devops_db_test
          APP_NAME: "DevOps CI Service"
          APP_ENV: test
          DEBUG: "False"
        run: |
          pytest -v

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate to Docker Hub using GitHub Secrets (only on push to main/master)
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push container image to Docker Hub
      - name: Build & Push Application Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-item-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-item-service:${{ github.sha }}

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (for compose configuration)
        uses: actions/checkout@v4

      # Copy docker-compose.yml to EC2 instance so EC2 does not need git repo access
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      # Execute remote deployment commands on EC2 via SSH
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKER_IMAGE_TAG
          env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
            DOCKER_IMAGE_TAG: ${{ github.sha }}
          script: |
            set -e
            cd ~/app

            # Export deployment environment variables
            export DOCKER_IMAGE="${DOCKERHUB_USERNAME}/devops-item-service:${DOCKER_IMAGE_TAG}"

            echo "Pulling latest application image: ${DOCKER_IMAGE}..."
            docker compose pull api

            echo "Starting containers..."
            docker compose up -d

            echo "Waiting for service to be healthy..."
            sleep 8

            echo "Performing HTTP health check..."
            curl --fail --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/health || {
              echo "Health check failed!"
              docker compose logs --tail 30
              exit 1
            }

            echo "Deployment successful and verified healthy!"
